    <rect class="sweep" x="0" y="68" width="150" height="112" fill="url(#sheen)"/>
  </g>
  <text class="sans" x="480" y="204" text-anchor="middle" font-size="24" font-weight="600" fill="#d0e9df">Forecast future outcomes. Reflect on past experience.</text>

  <!-- Three readable phases remain present even when motion is disabled. -->
  <g class="sans" font-size="20" font-weight="600" text-anchor="middle" transform="translate(-224 -51.7) scale(1.1)">
    <rect x="441" y="257" width="116" height="42" rx="21" fill="#152a33" stroke="#305862"/>
    <rect class="stage" x="441" y="257" width="116" height="42" rx="21" fill="#1a3c43" stroke="#7fdbd4" stroke-width="1.3"/>
    <text x="499" y="284" fill="#a4e6df">Predict</text>
    <path d="M566 278 H578 m-5-4 5 4-5 4" fill="none" stroke="#627c91" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="584" y="257" width="112" height="42" rx="21" fill="#192b42" stroke="#38506d"/>
    <rect class="stage verify" x="584" y="257" width="112" height="42" rx="21" fill="#203b5b" stroke="#97baff" stroke-width="1.3"/>
