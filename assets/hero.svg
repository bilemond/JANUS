<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="janus-title janus-desc">
  <title id="janus-title">JANUS — Forecast future outcomes. Reflect on past experience.</title>
  <desc id="janus-desc">JANUS: Enhancing Long-Horizon Autonomous Research with Co-Evolving World Models. Forecast future outcomes. Reflect on past experience. Predict, Verify, and Evolve are highlighted in sequence: forecast proposal value, verify outcomes through experiments, and co-evolve the research agent, world model, and their coordination. A softly blurred evolving research graph in the background branches from verified results, combines research directions, and expands into candidate proposals.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#081c1b"/>
      <stop offset="0.5" stop-color="#102d29"/>
      <stop offset="1" stop-color="#071619"/>
    </linearGradient>
    <radialGradient id="ambient-glow" cx="0.52" cy="0.12" r="0.78">
      <stop offset="0" stop-color="#39a58a" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#237a70" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#237a70" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="past-glow" cx="0" cy="0.55" r="0.7">
      <stop offset="0" stop-color="#bfa36a" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#bfa36a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="future-glow" cx="1" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#37b9b0" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#37b9b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#f0dda7"/>
      <stop offset="0.45" stop-color="#c5efdc"/>
      <stop offset="1" stop-color="#62dfca"/>
    </linearGradient>
    <!-- Keep the graph perceptible at the edges and quiet behind the typography. -->
    <radialGradient id="graph-visibility" cx="0.5" cy="0.48" r="0.61">
      <stop offset="0" stop-color="#383838"/>
      <stop offset="0.43" stop-color="#383838"/>
      <stop offset="0.77" stop-color="#bdbdbd"/>
      <stop offset="1" stop-color="#ffffff"/>
    </radialGradient>
    <mask id="graph-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="380" mask-type="luminance">
      <rect width="960" height="380" fill="url(#graph-visibility)"/>
    </mask>
    <linearGradient id="graph-balance" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
    <mask id="graph-balance-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="380" mask-type="luminance">
      <rect width="960" height="380" fill="url(#graph-balance)"/>
    </mask>
    <filter id="graph-soften" x="-5%" y="-10%" width="110%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.85"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#a9d8ce" opacity="0.1"/>
    </pattern>
    <clipPath id="graph-area"><rect x="14" y="66" width="932" height="264"/></clipPath>
    <clipPath id="panel-clip"><rect x="2" y="2" width="956" height="376" rx="25"/></clipPath>
    <clipPath id="name-clip">
      <text x="480" y="161" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="100" font-weight="800" letter-spacing="3">JANUS</text>
    </clipPath>
    <clipPath id="caption-clip"><rect x="50" y="294" width="860" height="34"/></clipPath>
    <style>
      .sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .stage { animation: stage 9s ease-in-out infinite; }
      .verify { animation-delay: -6s; }
      .evolve { animation-delay: -3s; }
      @keyframes stage {
        0%, 25% { opacity: 1; }
        31%, 94% { opacity: 0.16; }
        100% { opacity: 1; }
      }
      .sweep { animation: sweep 3.2s cubic-bezier(.4, 0, .2, 1) infinite; }
      @keyframes sweep {
        0% { transform: translateX(140px) skewX(-16deg); }
        60%, 100% { transform: translateX(760px) skewX(-16deg); }
      }
      .name-light { animation: name-light 3.2s ease-in-out infinite; }
      @keyframes name-light {
        0%, 100% { opacity: 0.02; }
        45% { opacity: 0.2; }
      }
      .caption { animation: captions 9s cubic-bezier(.65, 0, .35, 1) infinite; }
      @keyframes captions {
        0%, 26% { transform: translateY(0); }
        33.333%, 59% { transform: translateY(-36px); }
        66.667%, 92% { transform: translateY(-72px); }
        100% { transform: translateY(-108px); }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .sweep, .name-light { display: none; }
        .stage { opacity: 0.6; }
      }
    </style>
  </defs>

  <!-- A self-contained vector asset: no scripts, foreignObject, images, or external resources. -->
  <g clip-path="url(#panel-clip)">
    <rect width="960" height="380" fill="url(#background)"/>
    <rect width="960" height="380" fill="url(#ambient-glow)"/>
    <rect width="960" height="380" fill="url(#past-glow)"/>
    <rect width="960" height="380" fill="url(#future-glow)"/>
    <rect width="960" height="380" fill="url(#dots)" opacity="0.32"/>
    <!-- One source and irregular merges, with more early branches and a quieter, open frontier. -->
    <g clip-path="url(#graph-area)" mask="url(#graph-mask)">
      <g mask="url(#graph-balance-mask)">
        <g filter="url(#graph-soften)" opacity="0.43" aria-hidden="true">
