  <rect x="2" y="2" width="956" height="376" rx="25" fill="none" stroke="#36594f" stroke-width="1.4"/>

  <text class="sans" x="480" y="54" text-anchor="middle" font-size="18" font-weight="500" letter-spacing="0.2" fill="#a4c4ba">Enhancing Long-Horizon Autonomous Research with Co-Evolving World Models</text>

  <text class="sans" x="480" y="161" text-anchor="middle" font-size="100" font-weight="800" letter-spacing="3" fill="url(#wordmark)">JANUS</text>
  <text class="sans name-light" x="480" y="161" text-anchor="middle" font-size="100" font-weight="800" letter-spacing="3" fill="#ecfff7" opacity="0.02">JANUS</text>
